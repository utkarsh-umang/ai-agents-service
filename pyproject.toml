[tool.poetry]
name = "ai-agents-service"
version = "0.1.0"
description = "AI agents service"
authors = []
readme = "README.md"
packages = [{ include = "ai_agents" }]

# Dependencies are split into a small core plus per-agent extras, so a consumer
# installs only what its agent needs. Consumers request them explicitly, e.g.
#   ai-agents-service = { git = "...", branch = "develop", extras = ["thumbnail"] }
# For local development of this repo, install everything: `poetry install --all-extras`.
[tool.poetry.dependencies]
python = "^3.10"

# ── Core ──────────────────────────────────────────────────────────────────
# Unavoidable for `import ai_agents`: __init__.py eagerly imports the thumbnail
# agent, so its three deps are core rather than an extra. pydantic and
# typing-extensions are imported directly by email_finder's data contracts;
# they arrive transitively too, but production code importing them explicitly
# should not depend on someone else's resolver.
httpx = "^0.28.1"
openai = "^2.30.0"
google-genai = "^1.70.0"
pydantic = "^2.9"
typing-extensions = "^4.12"
python-dotenv = "*"

# ── email_finder (extra: finder) ──────────────────────────────────────────
# crawl4ai transitively supplies lxml, beautifulsoup4, aiofiles, aiosqlite,
# pillow, requests and playwright — previously declared here by hand, now left
# to it. requests stays explicit because guest_finder.py imports it directly.
crawl4ai = { version = "^0.8.6", optional = true }
litellm = { version = "^1.83.4", optional = true }
langgraph = { version = "^1.1.6", optional = true }
langfuse = { version = "^2.0", optional = true }
nest-asyncio = { version = "*", optional = true }
requests = { version = "^2.32", optional = true }

# ── short_video_generator (extra: shortvideo) ─────────────────────────────
# Never declared before this — the agent only ever ran from a local env freeze.
# langchain, langchain-openai and google-api-python-client were dropped from the
# manifest when they were genuinely unused; this agent brings them back, so they
# return as optional rather than core.
# yt-dlp stays: it is still the transcript fallback (caption download), even
# though the video download moved out with the media half.
langchain = { version = "*", optional = true }
langchain-core = { version = "*", optional = true }
langchain-openai = { version = "*", optional = true }
google-api-python-client = { version = "^2.196.0", optional = true }
# Upstream caps itself at <3.15. Marked here rather than narrowing the project's
# own python range, which would propagate the cap to every consumer.
youtube-transcript-api = { version = "^1.2.4", optional = true, python = ">=3.10,<3.15" }
yt-dlp = { version = "^2026.7.4", optional = true }
isodate = { version = "^0.7.2", optional = true }

[tool.poetry.extras]
# Empty by design: everything the thumbnail agent needs is already core.
thumbnail = []
finder = ["crawl4ai", "litellm", "langgraph", "langfuse", "nest-asyncio", "requests"]
# langgraph, langfuse and requests are shared with `finder`; an optional
# dependency may appear in more than one extra.
shortvideo = [
    "langchain",
    "langchain-core",
    "langchain-openai",
    "langgraph",
    "langfuse",
    "google-api-python-client",
    "youtube-transcript-api",
    "yt-dlp",
    "isodate",
    "requests",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]
