[tool.poetry]
name = "ai-agents-service"
version = "0.1.0"
description = "AI agents service"
authors = []
readme = "README.md"
packages = [{ include = "ai_agents" }]

[tool.poetry.dependencies]
python = "^3.10"
langchain = "*"
langchain-core = "*"
langchain-openai = "*"
openai = "^2.30.0"
python-dotenv = "*"
google-genai = "^1.70.0"
pillow = "^12.2.0"
httpx = "^0.28.1"
langgraph = "^1.1.6"
litellm = "^1.83.4"
langfuse = "^2.0"
nest-asyncio = "*"
crawl4ai = "^0.8.6"
google-api-python-client = "^2.196.0"
google-auth = "^2.53.0"
google-auth-oauthlib = "^1.4.0"
gspread = "^6.2.1"
pandas = "<3"
lxml = "<6"
pymongo = "^4.17.0"
motor = "^3.7.1"
fastapi = "^0.136.3"
uvicorn = "^0.48.0"
beautifulsoup4 = "^4.14.3"
selenium = "^4.44.0"
webdriver-manager = "^4.1.1"
firecrawl-py = "^4.28.0"
email-validator = "^2.3.0"
aiofiles = "^25.1.0"
aiosqlite = "^0.22.1"
ipykernel = "^7.2.0"
jupyter-client = "^8.8.0"
jupyter-core = "^5.9.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]
